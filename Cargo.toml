[package]
name = "voice-runtime"
version = "0.1.0"
edition = "2021"

[lib]
# Rust crates with hyphens are imported with underscores: `voice_runtime`
name = "voice_runtime"
path = "src/lib.rs"

[[bin]]
name = "voice-runtime"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
glib = "0.18.5"
gtk = "0.18.2"
hound = "3.5.1"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
transcribe-cpp = { version = "0.4.0", default-features = false }
